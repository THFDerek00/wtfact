name: Tägliche Beiträge

on:
  schedule:
    - cron: '0 2 * * *' # 04:00 Uhr deutscher Sommerzeit, 03:00 Uhr Winterzeit
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Drei Fakten pro Tag (FACTS_PER_DAY in src/config.ts), jeder in einer anderen Kategorie und
      # keiner aus einer Kategorie vom Vortag. Pro Fakt gibt es einen zweiten Versuch, falls die
      # Qualitätsprüfung den ersten Entwurf verwirft. Fällt ein Fakt ganz aus, rückt der nächste
      # auf seine Uhrzeit vor; lieber ein Fakt weniger als ein falscher.
      - name: Beiträge schreiben
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS_MANIFEST: ${{ runner.temp }}/posts.tsv
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Das Secret ANTHROPIC_API_KEY fehlt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          touch "$POSTS_MANIFEST"
          # Die Beiträge von heute warten als offene PRs, nicht auf main. Bei einem zweiten Lauf
          # am selben Tag würden sonst noch einmal drei geschrieben.
          today=$(TZ=Europe/Berlin date +%F)
          if git ls-remote --exit-code --heads origin "refs/heads/beitrag/$today-*" > /dev/null; then
            echo "Für $today gibt es schon Beitrags-PRs. Nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fakten aus PRs, die Eric noch nicht zusammengeführt hat, zählen mit: für die Sperre der
          # Kategorien vom Vortag und gegen Dopplungen. Sie liegen nur im Arbeitsordner, nicht im Commit.
          gh pr list --state open --base main --json headRefName --jq '.[].headRefName | select(startswith("beitrag/"))' |
          while read -r b; do
            git fetch -q origin "$b"
            git diff --name-only --diff-filter=A HEAD FETCH_HEAD -- db/facts | while read -r f; do
              git show "FETCH_HEAD:$f" > "$f"
            done
          done
          slots=$(node -e "console.log(require('fs').readFileSync('src/config.ts','utf8').match(/FACTS_PER_DAY\s*=\s*(\d+)/)[1])")
          for n in $(seq 1 "$slots"); do
            node scripts/generate-post.mjs || node scripts/generate-post.mjs || echo "::warning::Fakt $n wurde verworfen."
          done
          if [ ! -s "$POSTS_MANIFEST" ]; then
            echo "::error::Heute ist kein Fakt durch die Prüfung gekommen."
            exit 1
          fi

      - name: Seite testweise bauen
        if: steps.gen.outputs.skip != 'true'
        run: npm run build

      # Jeder Fakt kommt als eigener Pull Request (Zweig beitrag/JJJJ-MM-TT-N). Veröffentlicht wird
      # nichts automatisch: Eric führt die PRs selbst zusammen, dann geht der Fakt sofort live.
      - name: Als Pull Requests vorschlagen
        if: steps.gen.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POSTS_MANIFEST: ${{ runner.temp }}/posts.tsv
        run: |
          git config user.name "WTFact Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse --abbrev-ref HEAD)
          # Eigene Eingabe (3), damit git und gh die Liste nicht mitlesen.
          n=0
          while IFS=$'\t' read -r at title file <&3; do
            n=$((n + 1))
            branch="beitrag/${at:0:10}-$n"
            git switch -c "$branch"
            # Ein Fakt = eine SQL-Datei in db/facts/ (beide Sprachen), im PR als Text lesbar.
            git add "$file"
            git commit -m "Neuer Beitrag: $title"
            git push -u origin "$branch"
            gh pr create --base main --head "$branch" --title "Neuer Fakt: $title" \
              --body "Fakt $n von heute, fertig recherchiert und geprüft. **Veröffentlichen:** diesen PR mergen, der Fakt ist dann sofort auf der Seite. **Nicht veröffentlichen:** diesen PR schließen."
            git switch "$base"
          done 3< "$POSTS_MANIFEST"
